name: Daily freight briefing update

on:
  schedule:
    # 09:00 UTC every day — adjust to whenever you want your daily refresh
    - cron: '0 9 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate today's content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node generate-content.js

      - name: Commit updated data.json
        run: |
          git config user.name "logisticiti-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "Daily briefing update: $(date -u +%Y-%m-%d)"
          git push
